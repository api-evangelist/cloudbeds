aid: cloudbeds
url: https://raw.githubusercontent.com/api-evangelist/cloudbeds/refs/heads/main/apis.yml
name: Cloudbeds
kind: company
description: >-
  Cloudbeds is a San Diego-based hospitality management platform for small and mid-size independent hotels, hostels, and
  groups, offering PMS, channel manager, booking engine, payments, and a marketplace of integrations. Cloudbeds
  publishes a public REST API (v1.2 and v1.3), a GraphQL API, blueprints, and webhooks for reservations, guests, rooms,
  rates, payments, and events.
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
- Hospitality
- Hotels
- PMS
- Property Management
- Channel Manager
- Booking Engine
- Payments
created: '2026-05-08'
modified: '2026-05-24'
