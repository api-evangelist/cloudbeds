naftiko: 1.0.0-alpha2
info:
  label: Cloudbeds Guests
  description: >-
    Cloudbeds guest management capability covering guest list retrieval, lookup,
    creation, and updates across Cloudbeds properties via the v1.3 REST API.
  tags:
    - Cloudbeds
    - Guests
    - PMS
    - Hospitality
  created: '2026-05-24'
  modified: '2026-05-24'
binds:
  - namespace: env
    keys:
      CLOUDBEDS_API_KEY: CLOUDBEDS_API_KEY
capability:
  consumes:
    - type: http
      namespace: guests
      baseUri: https://hotels.cloudbeds.com/api/v1.3
      description: Cloudbeds REST API v1.3 guests surface.
      resources:
        - name: guestList
          path: /getGuestList
          operations:
            - name: listGuests
              method: GET
              description: List guests on a property.
              outputRawFormat: json
              inputParameters:
                - name: propertyID
                  in: query
                  type: string
                  required: true
                - name: pageNumber
                  in: query
                  type: integer
                - name: pageSize
                  in: query
                  type: integer
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: guest
          path: /getGuest
          operations:
            - name: getGuest
              method: GET
              description: Retrieve a single guest by ID.
              outputRawFormat: json
              inputParameters:
                - name: guestID
                  in: query
                  type: string
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: createGuest
          path: /postGuest
          operations:
            - name: createGuest
              method: POST
              description: Create a new guest record.
              outputRawFormat: json
              inputParameters:
                - name: body
                  in: body
                  type: object
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: updateGuest
          path: /putGuest
          operations:
            - name: updateGuest
              method: PUT
              description: Update an existing guest record.
              outputRawFormat: json
              inputParameters:
                - name: body
                  in: body
                  type: object
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
      authentication:
        type: apikey
        key: X-API-KEY
        value: '{{env.CLOUDBEDS_API_KEY}}'
        placement: header
  exposes:
    - type: mcp
      namespace: guests-mcp
      port: 9090
      transport: http
      description: MCP adapter for Cloudbeds Guests.
      tools:
        - name: cloudbeds-list-guests
          description: List Cloudbeds guests on a property.
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: guests.listGuests
          with:
            propertyID: tools.propertyID
        - name: cloudbeds-get-guest
          description: Retrieve a Cloudbeds guest by ID.
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: guests.getGuest
          with:
            guestID: tools.guestID
        - name: cloudbeds-create-guest
          description: Create a new Cloudbeds guest record.
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: guests.createGuest
          with:
            body: tools.body
